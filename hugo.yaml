baseURL: https://radar9.my.id/
languageCode: id-id
title: Edukasi Praktis
theme: PaperMod
pagination:
  pageSize: 10
  # Semua artikel ditampilkan dalam SATU halaman daftar.
  # Alasan: halaman paginasi seperti /posts/page/2/ hanya berisi 10 judul dengan
  # informasi yang sama seperti halaman sebelumnya, dan Google membacanya sebagai
  # halaman tipis/duplikat. Dengan 71 artikel, satu halaman panjang lebih baik.
  # Naikkan angka ini (mis. 50) kalau artikel sudah lewat 150.
  pagerSize: 100
  disableAliases: true
enableRobotsTXT: true
enableGitInfo: true

params:
  env: production
  title: Edukasi Praktis
  description: "Tips, rekomendasi, dan panduan praktis untuk guru, sekolah, dan madrasah — teknologi, peralatan, dan solusi sehari-hari."
  keywords: [edukasi, sekolah, madrasah, teknologi pendidikan, guru, printer sekolah, laptop guru]
  author: "Edukasi Praktis"
  defaultTheme: light
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowToc: true
  TocOpen: true
  
  homeInfoParams:
    Title: "Edukasi Praktis"
    Content: "Tips, rekomendasi, dan panduan praktis untuk guru, sekolah, dan madrasah."
  
  socialIcons:
    - name: "rss"
      url: "/index.xml"
  
  # SEO
  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: true
  
  editPost:
    URL: ""
    Text: ""
    appendFilePath: false

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      autoHeadingID: true

menu:
  main:
    - name: "Artikel"
      url: "/posts/"
      weight: 1
    - name: "Kategori"
      url: "/kategori/"
      weight: 2
    - name: "Jasa Olah Naskah"
      url: "/jasa-olah-naskah/"
      weight: 3
    - name: "Template Excel"
      url: "/produk-template-excel-madrasah-2026/"
      weight: 4
    - name: "Tentang"
      url: "/about/"
      weight: 5
    - name: "Kontak"
      url: "/contact/"
      weight: 6
    - name: "Privasi"
      url: "/privacy/"
      weight: 7
    - name: "Ketentuan"
      url: "/terms/"
      weight: 8

# Sitemap
sitemap:
  changefreq: daily
  priority: 0.5

# Output formats
outputs:
  home:
    - HTML
    - RSS
    - JSON

# Minify
minify:
  minifyOutput: true

# ---------------------------------------------------------------------------
# Halaman tag & kategori bawaan tema DIMATIKAN.
#
# Alasan: 71 artikel memakai tag bebas, sehingga lahir 183 halaman tag —
# 143 di antaranya hanya memuat 1 artikel (halaman nyaris kosong). Semuanya
# masuk sitemap (184 dari 279 alamat di sitemap adalah halaman tag). Google
# membaca ini sebagai situs berisi halaman tipis, dan itulah yang memunculkan
# penilaian "Konten tanpa manfaat".
#
# Pengganti navigasi kategori: halaman /kategori/<nama>/ buatan sendiri
# (content/kategori/) yang berisi teks pengantar + daftar artikel.
# JANGAN dihidupkan lagi tanpa membersihkan tag di 71 artikel lebih dulu.
# ---------------------------------------------------------------------------
taxonomies: {}
disableKinds:
  - taxonomy
  - term
